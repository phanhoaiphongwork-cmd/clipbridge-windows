name: Build ClipBridge.pyw

# Gộp app thành một file ClipBridge.pyw.
# - Mỗi lần push lên main: file nằm trong mục Artifacts của lần chạy (tải để thử).
# - Khi tạo Release trên GitHub: file tự được đính kèm vào Release đó.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python build_single.py -o dist/ClipBridge.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBridge
          path: dist/ClipBridge.pyw
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/ClipBridge.pyw --clobber
